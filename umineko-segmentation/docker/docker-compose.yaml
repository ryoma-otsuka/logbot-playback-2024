services:
  har-torch:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: umineko-torch  # Changed to a more descriptive name
    privileged: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all  # 'all' is more flexible for different GPU setups
            capabilities: [gpu]
    volumes: # Mount Local:Container
      # Use relative paths for portability
      - ./:/code
      # Data should be mounted by the user to /code/data or similar
      # - /path/to/your/data:/code/data 
    ports:
      - "8888:8888" # Standard port mapping
    shm_size: 8gb